name: Free RDP - Windows 10 Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    env:
      RDP_USER: free_rdp
      RDP_CREDS: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Write-Host "Enabling RDP..."
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          net user $env:RDP_USER $env:RDP_CREDS /add
          net localgroup administrators $env:RDP_USER /add

      - name: Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile "tailscale.exe"
          Start-Process tailscale.exe -ArgumentList "/quiet" -Wait

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey=$env:TAILSCALE_AUTHKEY `
            --hostname=github-free-rdp

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Tailscale Address: $env:TAILSCALE_IP"
          Write-Host "Username: free rdp"
          Write-Host "Password: [HIDDEN]"
          Write-Host "==================`n"

      - name: Keep Runner Active
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Cancel workflow to terminate"
            Start-Sleep -Seconds 300
          }
